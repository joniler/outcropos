# outcrop — lock screen, talaria palette (ground + warm gold accent)

background {
    monitor =
    color = rgba(9, 10, 9, 1.0)   # #090A09 ground
}

label {
    monitor =
    text = outcrop
    color = rgba(200, 180, 108, 1.0)   # #C8B46C warm gold
    font_size = 64
    font_family = JetBrainsMono Nerd Font

    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    inner_color = rgba(20, 19, 18, 1.0)     # #141312 panel
    outer_color = rgba(200, 180, 108, 1.0)  # gold outline
    font_color = rgba(231, 226, 219, 1.0)   # #E7E2DB readout
    fade_on_empty = false
    placeholder_text =
    hide_input = false

    position = 0, 40
    halign = center
    valign = center
}
