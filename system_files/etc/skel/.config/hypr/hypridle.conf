# outcrop — idle policy: lock before the screen sleeps, lock on suspend
# (lid close suspends via logind's default HandleLidSwitch, which triggers
# before_sleep_cmd — so lid-close locks too)

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = kanshi reload
}

# 3 min idle -> lock
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# 10 min idle -> screen off (any input wakes)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
