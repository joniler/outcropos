# outcrop — Hyprland session
# Noctalia is the shell: bar, notifications, launcher (SUPER+SPACE by its own
# default keymap), wallpaper, screenshots, settings (`noctalia msg settings-open`).
# Everything visual belongs to Noctalia — this file stays deliberately thin.

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1

monitor = , preferred, auto, 1

# --- session -----------------------------------------------------------------
exec-once = noctalia --daemon
exec-once = kanshi
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- outcrop binds (the rest come from Hyprland/Noctalia defaults) ------------
$mod = SUPER

bind = $mod, Return, exec, ghostty
bind = $mod, E, exec, thunar
bind = $mod, L, exec, hyprlock
# night light: run once to warm, once more to stop
bind = $mod, N, exec, hyprsunset -t 3800
# monitor layout: edit the kanshi profile, which auto-applies on hotplug
bind = $mod, P, exec, ghostty -e sh -c 'nvim ~/.config/kanshi/config && kanshi reload'
# Noctalia settings
bind = $mod, comma, exec, noctalia msg settings-open
